# Local PostgreSQL for development. Run with Podman:
#   bun run db:up
#
# `network_mode: host` is deliberate. Creating a bridge network fails on this
# Podman machine because netavark cannot apply an nftables ruleset — the WSL
# kernel is missing the nf_tables modules it needs, and the machine image has no
# iptables to fall back to:
#
#   netavark (exit code 1): nftables error: "nft" did not return successfully
#
# Running on the VM's own network side-steps netavark entirely, and WSL2
# forwards localhost, so Windows still reaches Postgres on 127.0.0.1:5432.
# Because of that, `ports:` is intentionally absent — it has no meaning here.
#
# A named volume is used rather than a bind mount because rootless Podman maps
# the container's postgres user into a subuid range, which makes a host bind
# mount fail on permissions.

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: hoshid-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: hoshid
      POSTGRES_PASSWORD: hoshid
      POSTGRES_DB: hoshid
    volumes:
      - hoshid-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoshid -d hoshid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hoshid-pgdata:
