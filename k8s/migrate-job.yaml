# マイグレーションの適用と、鍵の保守。
#
# **アプリより先に、必ず終わってから**流す。ArgoCD の PreSync フックにして
# あるので、Deployment の更新前に実行され、失敗すれば同期が止まる。
# スキーマが古いまま新しいコードを立ち上げると「一部の画面だけ 500」という
# 分かりにくい壊れ方をする。
#
# 中身（bun run deploy:prepare）:
#   1. prisma migrate deploy
#   2. 鍵の保守 — 期限の設定・暗号文の再暗号化・公開の終わった鍵の削除
#      どれもべき等。**鍵の交換と失効は含まない**（人が判断すること）。
apiVersion: batch/v1
kind: Job
metadata:
  name: hoshid-migrate
  namespace: hoshid
  annotations:
    # **PreSync にしない。** あれは通常リソースより前に走るので、初回の同期で
    # ConfigMap も Secret もまだ無く、`configmap "hoshid-config" not found` で
    # 落ちる（実際に踏んだ）。
    #
    # Sync フック + sync-wave なら、通常リソースと同じ流れの中で順序を付けられる。
    #   wave 0  ConfigMap / SealedSecret / PostgreSQL
    #   wave 1  このジョブ（DB が Healthy になってから）
    #   wave 2  アプリ本体
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    # 前回の Job を消してから作る。Job の spec は変更できないので、
    # 消さずに再適用すると immutable のエラーになる。
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # 数値で指定する。名前だと kubelet が解決できず起動しない。
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # アプリとは別のイメージ。Prisma CLI とスクリプトを含む。
          # **タグはアプリと必ず揃える。** ずれると、まだ無いカラムを前提に
          # したコードが動くことになる。kustomization.yaml で両方まとめて指定。
          image: ghcr.io/ibuki-hum4/hoshid-migrator:v0.1.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hoshid-config
            - secretRef:
                name: hoshid-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
